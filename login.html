<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="asserts/favicon_v2.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Sign In — SPICE ROUTE</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.js"></script>

  <style>
    :root, html[data-theme='light'] {
      --bg:            #F5EFE3;
      --bg-subtle:     #EDE4D2;
      --surface:       #FFFDF8;
      --text:          #1F1810;
      --text-muted:    #56442F;
      --text-subtle:   #857054;
      --border:        #D8C8AE;
      --border-strong: #BAA684;
      --brand:         #8B2E08;
      --brand-hover:   #6B2205;
      --brand-soft:    #F2E0D2;
      --ink:           #1A120A;
      --olive:         #5A6B32;
      --olive-soft:    #E6EAD4;
      --amber:         #B45309;
      --amber-soft:    #F2E2C9;
      --nav-hover:     #EDE4D2;
    }
    html[data-theme='dark'] {
      --bg:            #14100A;
      --bg-subtle:     #1D170F;
      --surface:       #1D170F;
      --text:          #F2E6D2;
      --text-muted:    #B9A585;
      --text-subtle:   #857054;
      --border:        #302516;
      --border-strong: #4A3924;
      --brand:         #D67745;
      --brand-hover:   #E28958;
      --brand-soft:    #3A1E10;
      --ink:           #F2E6D2;
      --olive:         #A8B87A;
      --olive-soft:    #2C3320;
      --amber:         #E6A857;
      --amber-soft:    #3A2E10;
      --nav-hover:     #291E12;
    }

    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(139,46,8,0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(90,107,50,0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(180,83,9,0.04) 0%, transparent 60%);
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', 'Plus Jakarta Sans', serif;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      color: var(--text);
    }

    .t-text { color: var(--text); }
    .t-muted { color: var(--text-muted); }
    .t-subtle { color: var(--text-subtle); }
    .t-brand { color: var(--brand); }
    .t-olive { color: var(--olive); }
    .bg-app { background-color: var(--bg); }
    .bg-surface { background-color: var(--surface); }
    .bg-brand-soft { background-color: var(--brand-soft); }
    .border-app { border-color: var(--border); }
    .border-strong { border-color: var(--border-strong); }

    .hand {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      color: var(--brand);
      line-height: 1.1;
    }

    /* Brand lockup */
    .brand-lockup { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; transition: opacity 0.2s ease; }
    .brand-lockup:hover { opacity: 0.85; }
    .brand-mark {
      position: relative; width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--brand) 0%, var(--brand-hover) 100%);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 4px 12px -4px rgba(139, 46, 8, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .brand-mark::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, 0.4); }
    .brand-mark svg { position: relative; z-index: 1; width: 21px; height: 21px; color: #fff; }
    .brand-wordmark { white-space: nowrap;
      font-family: 'Playfair Display', serif; font-weight: 800; font-size: 23px;
      letter-spacing: -0.02em; line-height: 1; color: var(--text);
      display: flex; flex-direction: column; gap: 3px;
    }
    .brand-wordmark .sub {
      font-family: 'Inter', sans-serif; font-weight: 500; font-size: 9px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-subtle);
    }

    
    /* Brand lockup */
    .brand-lockup { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; transition: opacity 0.2s ease; }
    .brand-lockup:hover { opacity: 0.85; }

      position: relative; width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--brand) 0%, var(--brand-hover) 100%);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 4px 12px -4px rgba(139, 46, 8, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .brand-mark::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, 0.4); }
    .brand-mark svg { position: relative; z-index: 1; width: 21px; height: 21px; color: #fff; }
    .brand-wordmark { white-space: nowrap;
      font-family: 'Playfair Display', serif; font-weight: 800; font-size: 23px;
      letter-spacing: -0.02em; line-height: 1; color: var(--text);
      display: flex; flex-direction: column; gap: 3px;
    }
    .brand-wordmark .sub {
      font-family: 'Inter', sans-serif; font-weight: 500; font-size: 9px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-subtle);
    }

    
    /* Main page layout */
    .page {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 16px 16px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative glyphs */
    .glyph {
      position: absolute;
      pointer-events: none;
      color: var(--brand);
      opacity: 0.05;
      font-weight: 900;
      font-family: 'Playfair Display', serif;
      user-select: none;
      z-index: 1;
    }
    .glyph-1 { top: 6%; left: 4%; transform: rotate(-15deg); font-size: 8rem; }
    .glyph-2 { bottom: 8%; right: 4%; transform: rotate(20deg); font-size: 12rem; color: var(--olive); opacity: 0.05; }
    .glyph-3 { top: 45%; right: 8%; font-size: 5rem; color: var(--amber); opacity: 0.06; }

    /* Card */
    .auth-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 32px;
      box-shadow:
        0 4px 12px rgba(31, 24, 16, 0.04),
        0 20px 50px -18px rgba(31, 24, 16, 0.16),
        0 50px 100px -35px rgba(31, 24, 16, 0.1);
      margin: auto;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 24px 20px; border-radius: 16px; }
      .page { padding: 64px 12px 12px 12px; }
    }

    /* Form fields */
    .field-label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      padding: 12px 15px;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .field-input::placeholder { color: var(--text-subtle); }
    .field-input:focus {
      background: var(--surface);
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(139, 46, 8, 0.1);
    }

    /* Password wrapper */
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 8px 10px;
      font-size: 14px;
      transition: color 0.15s ease;
      line-height: 1;
      border-radius: 8px;
    }
    .pw-toggle:hover { color: var(--brand); background: var(--bg-subtle); }

    /* Primary button */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
      line-height: 1;
      width: 100%;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-hover) 100%);
      color: #fff;
      box-shadow: 0 4px 12px -4px rgba(139, 46, 8, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(139, 46, 8, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-primary:active { transform: translateY(0); }

    /* Social buttons */
    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .social-btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Divider */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-subtle);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Card footer */
    .card-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-subtle);
    }
    .card-footer a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .card-footer a:hover { opacity: 0.75; }

    /* Success state */
    .success-panel {
      background: var(--olive-soft);
      border: 1px solid var(--olive);
      border-radius: 12px;
      padding: 12px 14px;
    }

    /* Checkbox */
    .checkbox-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .checkbox-row input { accent-color: var(--brand); width: 15px; height: 15px; cursor: pointer; }

    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="antialiased">

  <main class="page">

    <!-- Decorative background glyphs -->
    <span class="glyph glyph-1" aria-hidden="true">§</span>
    <span class="glyph glyph-2" aria-hidden="true">№</span>
    <span class="glyph glyph-3" aria-hidden="true">❦</span>

    
    
    <!-- Top Left Back Button -->
    <a href="index.html" class="absolute top-4 left-4 z-10 flex items-center justify-center h-10 px-4 rounded-full border border-app bg-surface t-muted hover:bg-black/5 transition gap-2 text-xs font-semibold" aria-label="Back to home">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to home</span>
    </a>

    <!-- Top Right Toggles -->
    <div class="absolute top-4 right-4 flex gap-2 z-10">
      <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 rounded-full border border-app bg-surface t-muted hover:opacity-75 transition" aria-label="Toggle theme">
        <i class="fa-solid fa-sun light-icon"></i>
        <i class="fa-solid fa-moon dark-icon hidden"></i>
      </button>
      <button id="lang-icon" class="flex items-center justify-center w-10 h-10 rounded-full border border-app bg-surface t-muted hover:opacity-75 transition text-xs font-bold" aria-label="Toggle direction">
        LTR
      </button>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Brand lockup -->
      <div class="flex justify-center mb-5">
        <a href="index.html" class="brand-lockup" aria-label="SPICE ROUTE Home">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2c-2 3-3 6-3 9a3 3 0 0 0 6 0c0-3-1-6-3-9z"/>
              <path d="M8 17c-1.5 1-2.5 2.5-2.5 4h13c0-1.5-1-3-2.5-4"/>
              <circle cx="12" cy="13" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="brand-wordmark">
            <span>SPICE ROUTE</span>
            <span class="sub">Heritage Blends</span>
          </span>
        </a>
      </div>

      
      <!-- Heading -->
      <div class="mb-4 text-left">
        <p class="hand text-2xl mb-1">— welcome back,</p>
        <h1 class="text-3xl mb-1 font-bold" style="font-family:'Playfair Display',serif;">
          Sign <span class="italic font-normal t-brand">in</span>.
        </h1>
        <p class="text-[13px] t-muted">
          Your orders, saved blends, and re-order list.
        </p>
      </div>

      <!-- Form -->
      <form id="login-form" class="flex flex-col gap-3" onsubmit="event.preventDefault(); handleLogin();">

        
        <div>
          <label for="login-email" class="field-label">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-xs opacity-50 t-muted"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required class="field-input" style="padding-left: 34px;" autocomplete="email">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="field-label" style="margin-bottom: 0;">Password</label>
            <a href="#" class="text-[11px] font-semibold t-brand hover:opacity-75 transition">Forgot Password?</a>
          </div>
          <div class="pw-wrap relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-xs opacity-50 t-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="login-password" name="password" placeholder="••••••••" required class="field-input" autocomplete="current-password" style="padding-left: 34px; padding-right: 48px;">
            <button type="button" class="pw-toggle" onclick="togglePassword()" aria-label="Show password">
              <i class="fa-solid fa-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="remember" checked>
          <span class="text-[12px] t-muted">Keep me signed in</span>
        </label>

        
        <button type="submit" class="btn-primary mt-1 w-full" style="width: 100%;">
          Sign In <i class="fa-solid fa-arrow-right text-xs ml-1"></i>
        </button>

        <div id="login-success" class="hidden success-panel">
          <div class="flex items-start gap-3">
            <i class="fa-solid fa-circle-check text-lg" style="color: var(--olive);"></i>
            <div>
              <p class="text-sm font-semibold" style="color: var(--olive);">Welcome back.</p>
              <p class="text-xs t-muted mt-1">Redirecting…</p>
            </div>
          </div>
        </div>

      </form>

      <!-- Divider -->
      <div class="or-divider my-4">or continue with</div>

      <!-- Social buttons -->
      <div class="grid grid-cols-2 gap-2.5">
        <a href="#" class="social-btn">
          <i class="fab fa-google" style="color: #DB4437;"></i>
          Google
        </a>
        <a href="#" class="social-btn">
          <i class="fab fa-apple"></i>
          Apple
        </a>
      </div>

      <!-- Signup prompt -->
      <p class="text-center text-[12.5px] t-muted mt-4 pt-3 border-t border-app">
        New to Spice Route?
        <a href="signup.html" class="font-semibold t-brand hover:opacity-75 transition">Create an account</a>
      </p>

      </div>

  </main>

  <!-- ═══════════════════════ SCRIPTS ═══════════════════════ -->
  <script>
    (function () {
      'use strict';
      const html = document.documentElement;

      const applyTheme = (t) => {
        html.setAttribute('data-theme', t);
        document.querySelectorAll('.light-icon').forEach(i => i.classList.toggle('hidden', t === 'dark'));
        document.querySelectorAll('.dark-icon').forEach(i => i.classList.toggle('hidden', t === 'light'));
      };
      const setTheme = (t) => { localStorage.setItem('theme', t); applyTheme(t); };
      applyTheme(localStorage.getItem('theme') || 'light');

      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        setTheme(html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });

      const applyDir = (d) => html.setAttribute('dir', d === 'ar' ? 'rtl' : 'ltr');
      applyDir(localStorage.getItem('language') || 'en');
      document.getElementById('lang-icon')?.addEventListener('click', () => {
        const next = (localStorage.getItem('language') === 'ar') ? 'en' : 'ar';
        localStorage.setItem('language', next);
        applyDir(next);
      });
    })();

    function togglePassword() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('pw-icon');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.add('fa-eye');
        icon.classList.remove('fa-eye-slash');
      }
    }

    function handleLogin() {
      const form = document.getElementById('login-form');
      const success = document.getElementById('login-success');
      if (!form || !success) return;
      success.classList.remove('hidden');
      success.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => {
        form.reset();
        success.classList.add('hidden');
      }, 3500);
    }
  </script>
</body>
</html>
